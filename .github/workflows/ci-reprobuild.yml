name: CI (reprobuild)

# Re-plays the project's deterministic dev env through reprobuild on all
# five target legs. This workflow is deliberately thin: the shared
# `setup-dev-env` action materialises the environment `repro.nim`
# declares, and the job then runs `repro build` / `repro test` plus the
# legacy `just` cross-checks inside it. Tools the build needs belong in
# `repro.nim`, never here -- see
# metacraft-dev-guidelines/policies/ci-shared-dev-env.md §1, §2 and §5,
# and repo-requirements.md §5 for the five-leg requirement.

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event gets a group unique to its run_id, so it is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: [self-hosted, linux, x64]
            just-test: test
          - os: linux
            arch: arm64
            runner: [self-hosted, linux, arm64]
            just-test: test
          - os: macos
            arch: arm64
            runner: [self-hosted, macos, arm64]
            just-test: test
          - os: windows
            arch: x64
            runner: [self-hosted, windows, x64]
            just-test: test-windows
          - os: windows
            arch: arm64
            runner: [self-hosted, windows, arm64]
            just-test: test-windows
    runs-on: ${{ matrix.runner }}
    env:
      # Windows has no Nix; its declared tools come from the reprobuild
      # tarball realizations. The POSIX legs realize them through Nix.
      REPRO_TOOL_PROVISIONING: ${{ matrix.os == 'windows' && 'tarball' || 'nix' }}
    steps:
      - uses: actions/checkout@v4

      # A GitHub App installation token lets setup-dev-env clone private
      # metacraft-labs repositories (the free plan does not expose org-level
      # secrets to every repository).
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild flavor)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: reprobuild
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: repro build
        run: dev-exec repro build

      - name: repro test
        run: dev-exec repro test

      - name: just build (cross-check)
        run: dev-exec just build

      # On Windows the documented lane is `just test-windows`: the shared
      # suite plus the Windows-only console tests and the control-handler
      # ownership probes (real console events in isolated children).
      - name: just test (cross-check)
        run: dev-exec just ${{ matrix.just-test }}

      # Per-action stdio captures and the failure report. Hidden files must be
      # included explicitly: actions/upload-artifact@v4 skips any path whose
      # basename starts with "." (so `.repro/` would otherwise be skipped).
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .repro/build/*/build-failure-report.json
            .repro/build/*/build-engine-cache/actions/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
